<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PASSWORD POLICE — Password Strength Checker</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --surface2: #1a1a26;
    --border: rgba(255,255,255,0.07);
    --accent: #00ffa3;
    --accent2: #ff6b6b;
    --accent3: #ffd93d;
    --accent4: #6bcbff;
    --text: #f0f0f5;
    --muted: #6b6b80;
    --font-display: 'Syne', sans-serif;
    --font-mono: 'Space Mono', monospace;
  }

  html { font-size: 16px; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-display);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
    padding: 2rem 1rem;
  }

  /* Background grid */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,255,163,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,255,163,0.03) 1px, transparent 1px);
    background-size: 48px 48px;
    pointer-events: none;
    z-index: 0;
  }

  /* Glow blob */
  body::after {
    content: '';
    position: fixed;
    top: -20%;
    left: 50%;
    transform: translateX(-50%);
    width: 600px;
    height: 600px;
    background: radial-gradient(ellipse, rgba(0,255,163,0.07) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 560px;
  }

  /* Header */
  .header {
    text-align: center;
    margin-bottom: 2.5rem;
    animation: fadeDown 0.6s ease both;
  }

  .logo {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 1.2rem;
  }

  .logo-icon {
    width: 36px;
    height: 36px;
    border: 2px solid var(--accent);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .logo-icon svg { width: 18px; height: 18px; stroke: var(--accent); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .logo-name {
    font-size: 18px;
    font-weight: 800;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
  }

  .header h1 {
    font-size: clamp(2rem, 6vw, 3rem);
    font-weight: 800;
    line-height: 1.1;
    letter-spacing: -0.02em;
    margin-bottom: 0.6rem;
  }

  .header h1 span { color: var(--accent); }

  .header p {
    font-size: 15px;
    color: var(--muted);
    font-family: var(--font-mono);
    font-weight: 400;
    letter-spacing: 0.01em;
  }

  /* Card */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 2rem;
    animation: fadeUp 0.6s 0.15s ease both;
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: 0.5;
  }

  /* Input */
  .input-group {
    position: relative;
    margin-bottom: 1.5rem;
  }

  .input-label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
    font-family: var(--font-mono);
  }

  .input-wrap {
    position: relative;
  }

  .pw-input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 48px 14px 16px;
    font-family: var(--font-mono);
    font-size: 16px;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    letter-spacing: 0.08em;
  }

  .pw-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(0,255,163,0.1);
  }

  .pw-input::placeholder { color: var(--muted); letter-spacing: 0.05em; }

  .toggle-btn {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    cursor: pointer;
    color: var(--muted);
    padding: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: color 0.2s;
  }

  .toggle-btn:hover { color: var(--accent); }
  .toggle-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* Strength bar */
  .strength-section { margin-bottom: 1.5rem; }

  .strength-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 10px;
  }

  .strength-label {
    font-size: 13px;
    font-family: var(--font-mono);
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    transition: color 0.3s;
  }

  .strength-score {
    font-size: 11px;
    font-family: var(--font-mono);
    color: var(--muted);
  }

  .bar-track {
    display: flex;
    gap: 4px;
    height: 6px;
    border-radius: 99px;
    overflow: hidden;
  }

  .bar-seg {
    flex: 1;
    background: var(--surface2);
    border-radius: 99px;
    transition: background 0.3s;
  }

  /* Criteria */
  .criteria-title {
    font-size: 11px;
    font-family: var(--font-mono);
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 12px;
  }

  .criteria-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 1.5rem;
  }

  .crit {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 12px;
    font-family: var(--font-mono);
    color: var(--muted);
    transition: all 0.25s;
  }

  .crit.met {
    border-color: rgba(0,255,163,0.3);
    background: rgba(0,255,163,0.06);
    color: var(--accent);
  }

  .crit-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--muted);
    transition: background 0.25s, box-shadow 0.25s;
    flex-shrink: 0;
  }

  .crit.met .crit-dot {
    background: var(--accent);
    box-shadow: 0 0 6px var(--accent);
  }

  /* Entropy */
  .stats-row {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    margin-bottom: 1.5rem;
  }

  .stat-box {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    text-align: center;
  }

  .stat-val {
    font-size: 20px;
    font-weight: 800;
    font-family: var(--font-mono);
    line-height: 1;
    margin-bottom: 4px;
    transition: color 0.3s;
  }

  .stat-key {
    font-size: 10px;
    font-family: var(--font-mono);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* Tip */
  .tip {
    font-size: 13px;
    font-family: var(--font-mono);
    color: var(--accent4);
    background: rgba(107,203,255,0.07);
    border: 1px solid rgba(107,203,255,0.2);
    border-radius: 8px;
    padding: 10px 14px;
    display: none;
    line-height: 1.6;
  }

  .tip.show { display: block; }
  .tip::before { content: '→ '; }

  /* Footer */
  .footer {
    text-align: center;
    margin-top: 2rem;
    font-size: 12px;
    font-family: var(--font-mono);
    color: var(--muted);
    animation: fadeUp 0.6s 0.3s ease both;
  }

  /* Animations */
  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Shake for very weak */
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-4px); }
    40% { transform: translateX(4px); }
    60% { transform: translateX(-3px); }
    80% { transform: translateX(3px); }
  }
  .shake { animation: shake 0.4s ease; }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </div>
      <span class="logo-name">PASSWORD POLICE</span>
    </div>
    <h1>Is your password<br><span>strong enough?</span></h1>
    <p>// real-time security analysis</p>
  </div>

  <div class="card" id="card">
    <label class="input-label" for="pwInput">enter password</label>
    <div class="input-group">
      <div class="input-wrap">
        <input type="password" class="pw-input" id="pwInput" placeholder="Type your password here…" autocomplete="off" spellcheck="false" />
        <button class="toggle-btn" id="eyeBtn" aria-label="Toggle visibility" onclick="toggleVis()">
          <svg id="eyeSvg" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>

    <div class="strength-section">
      <div class="strength-header">
        <span class="strength-label" id="strengthLabel" style="color:var(--muted)">No password</span>
        <span class="strength-score" id="strengthScore"></span>
      </div>
      <div class="bar-track" id="barTrack">
        <div class="bar-seg" id="s1"></div>
        <div class="bar-seg" id="s2"></div>
        <div class="bar-seg" id="s3"></div>
        <div class="bar-seg" id="s4"></div>
        <div class="bar-seg" id="s5"></div>
        <div class="bar-seg" id="s6"></div>
      </div>
    </div>

    <div class="stats-row">
      <div class="stat-box">
        <div class="stat-val" id="statLen" style="color:var(--muted)">0</div>
        <div class="stat-key">length</div>
      </div>
      <div class="stat-box">
        <div class="stat-val" id="statEntropy" style="color:var(--muted)">0</div>
        <div class="stat-key">entropy bits</div>
      </div>
      <div class="stat-box">
        <div class="stat-val" id="statScore" style="color:var(--muted)">0<span style="font-size:12px">/6</span></div>
        <div class="stat-key">score</div>
      </div>
    </div>

    <div class="criteria-title">// security criteria</div>
    <div class="criteria-grid">
      <div class="crit" id="c-len"><span class="crit-dot"></span>8+ characters</div>
      <div class="crit" id="c-upper"><span class="crit-dot"></span>uppercase (A–Z)</div>
      <div class="crit" id="c-lower"><span class="crit-dot"></span>lowercase (a–z)</div>
      <div class="crit" id="c-num"><span class="crit-dot"></span>number (0–9)</div>
      <div class="crit" id="c-special"><span class="crit-dot"></span>special (!@#$…)</div>
      <div class="crit" id="c-long"><span class="crit-dot"></span>12+ characters</div>
    </div>

    <div class="tip" id="tipBox"></div>
  </div>

  <div class="footer">no data is stored or transmitted &nbsp;·&nbsp; 100% client-side</div>
</div>

<script>
const LEVELS = [
  { label: 'No password',  color: 'var(--muted)',    segs: 0 },
  { label: 'Very weak',    color: '#ff6b6b',         segs: 1 },
  { label: 'Weak',         color: '#ffd93d',         segs: 2 },
  { label: 'Fair',         color: '#ffd93d',         segs: 3 },
  { label: 'Strong',       color: '#6bcbff',         segs: 5 },
  { label: 'Very strong',  color: '#00ffa3',         segs: 6 },
];

const SEG_COLORS = ['#ff6b6b','#ff6b6b','#ffd93d','#ffd93d','#6bcbff','#00ffa3'];

const TIPS = {
  1: "This password folded under pressure instantly 💀",
  2: "A hacker guessed this while microwaving noodles.",
  3: "Okayyyy we're improving. The FBI is slightly less disappointed.",
  4: "Now we're talking. Your password survived 3 imaginary hackers.",
  5: "Certified hacker-proof. Even your ex can't crack this one."
};

function entropy(pw) {
  let pool = 0;
  if (/[a-z]/.test(pw)) pool += 26;
  if (/[A-Z]/.test(pw)) pool += 26;
  if (/[0-9]/.test(pw)) pool += 10;
  if (/[^a-zA-Z0-9]/.test(pw)) pool += 32;
  return pool ? Math.round(pw.length * Math.log2(pool)) : 0;
}

const input = document.getElementById('pwInput');
input.addEventListener('input', () => check(input.value));

function check(pw) {
  const len8    = pw.length >= 8;
  const len12   = pw.length >= 12;
  const upper   = /[A-Z]/.test(pw);
  const lower   = /[a-z]/.test(pw);
  const num     = /[0-9]/.test(pw);
  const special = /[^a-zA-Z0-9]/.test(pw);

  setMet('c-len',     len8);
  setMet('c-long',    len12);
  setMet('c-upper',   upper);
  setMet('c-lower',   lower);
  setMet('c-num',     num);
  setMet('c-special', special);

  let score = 0;
  if (pw.length) {
    if (len8)    score++;
    if (upper)   score++;
    if (lower)   score++;
    if (num)     score++;
    if (special) score++;
    if (len12)   score++;
    if (score < 1) score = 1;
  }

  const lv = LEVELS[score] || LEVELS[0];
  document.getElementById('strengthLabel').textContent = lv.label;
  document.getElementById('strengthLabel').style.color = lv.color;
  document.getElementById('strengthScore').textContent = pw.length ? `${score}/6 criteria met` : '';

  for (let i = 1; i <= 6; i++) {
    const seg = document.getElementById('s' + i);
    seg.style.background = i <= lv.segs ? SEG_COLORS[i - 1] : 'var(--surface2)';
  }

  document.getElementById('statLen').textContent = pw.length;
  document.getElementById('statLen').style.color = pw.length >= 12 ? 'var(--accent)' : pw.length >= 8 ? 'var(--accent3)' : 'var(--muted)';

  const ent = entropy(pw);
  document.getElementById('statEntropy').textContent = ent;
  document.getElementById('statEntropy').style.color = ent >= 60 ? 'var(--accent)' : ent >= 30 ? 'var(--accent3)' : 'var(--muted)';

  document.getElementById('statScore').innerHTML = `${score}<span style="font-size:12px">/6</span>`;
  document.getElementById('statScore').style.color = lv.color;

  const tip = document.getElementById('tipBox');
  if (pw.length && TIPS[score]) {
    tip.textContent = TIPS[score];
    tip.classList.add('show');
  } else {
    tip.classList.remove('show');
  }
}

function setMet(id, met) {
  document.getElementById(id).classList.toggle('met', met);
}

let visible = false;
const eyeSvg = document.getElementById('eyeSvg');
const eyeOff = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`;
const eyeOn  = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;

function toggleVis() {
  visible = !visible;
  input.type = visible ? 'text' : 'password';
  eyeSvg.innerHTML = visible ? eyeOff : eyeOn;
}
</script>
</body>
</html>
