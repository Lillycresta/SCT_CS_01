<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Keylogger Demo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>⌨️ Basic Keylogger Demo</h1>

        

        <textarea id="typingArea" placeholder="Start typing here..."></textarea>

        <div class="buttons">
            <button id="clearBtn">Clear Logs</button>
            <button id="downloadBtn">Download Logs</button>
        </div>

        <div class="log-box">
            <h2>Logged Keys:</h2>
            <p id="logs"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
